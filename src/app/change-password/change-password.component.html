<div class="flex justify-center bg-gray-100">
  <div class="border border-gray-300 p-8 rounded-none w-full bg-white text-center">

    <h2 class="text-2xl left font-bold mb-6">CHANGE PASSWORD</h2>

    <br>
    <form [formGroup]="changePassword" class="grid md:grid-cols-3 gap-3 text-left">

      <!-- Left Column -->
      <div class="ml-5">

        <!-- <div class="mb-4 flex"> -->
        <div class="mb-4">
          <!-- <p>First Name</p> -->
          <label class="block text-sm font-semibold mb-1">Old Password</label>
          <input type="text" formControlName="oldPassword"
            class="w-full border border-gray-400 px-3 py-2 focus:ring-2 focus:ring-purple-500" />
        </div>
      </div>

      <!-- Right Column -->
      <div class="ml-5">
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">New Password</label>
          <input type="text" formControlName="newPassword"
            class="w-full border border-gray-400 px-3 py-2 focus:ring-2 focus:ring-purple-500" />
        </div>
      </div>

      <!-- Profile Picture -->
      <div class="justify-center items-center ml-10">
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Confirm New Password</label>
          <input type="text" formControlName="confirmNewPassword"
            class="w-full border border-gray-400 px-3 py-2 focus:ring-2 focus:ring-purple-500" />
        </div>
      </div>

      <div class="col-span-3 flex flex-col items-center mt-4">
        <br>
        <button type="submit" 
          class="bg-purple-700 text-white px-8 py-2 font-bold hover:bg-purple-800 transition updatebtn">
          SUBMIT
        </button>
      </div>
    </form>

  </div>

</div>
