<div class="flex justify-center bg-gray-100 login-bg " *ngIf="loginPage">
  <div class="border border-gray-300 p-8 rounded-none w-full bg-white text-center formInsideLogin">
    <h2 class="text-2xl font-bold mb-6">LOG IN</h2>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-4">
        <input type="email" formControlName="userName" placeholder="Email"
          class="w-full px-3 py-2 border border-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
          required />
      </div>
      <div class="mb-2">
        <input type="password" formControlName="password" placeholder="Password"
          class="w-full px-3 py-2 border border-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
          required />
      </div>
      <div class="flex justify-between text-sm text-gray-700 mb-4 consern">
        <a (click)="frogetPassword()" style="cursor: pointer;" class="hover:text-purple-600">Forgot Password</a>
        <br>
        <a class="hover:text-purple-600" (click)="loginPage = false; signUpPage = true;" style="cursor: pointer;">Create an Account</a>
      </div>

      <!-- class="w-full bg-purple-700 text-white font-bold py-2 rounded-sm hover:bg-purple-800 transition signInBtn"> -->
      <button type="submit" class="w-full text-white font-bold py-2 rounded-sm transition signInBtn">
        SIGN IN
      </button>

      <div class="mt-4 google-signIn">
        <button type="button"
          class="w-full border border-gray-400 py-2 flex items-center justify-center hover:bg-gray-50 transition">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo"
            class="w-5 h-5 google-img" />
          <p class="google-signIn-text">
            &nbsp; Continue with Google
          </p>
        </button>
      </div>
    </form>

  </div>
</div>

<div class="flex justify-center bg-gray-100 p-6" *ngIf="signUpPage">
  <div class="w-full max-w-6xl bg-white border border-gray-300 rounded-lg p-6">

    <h2 class="text-2xl font-bold text-center mb-8">SIGN UP</h2>

    <!-- FORM STARTS -->
    <form [formGroup]="signUpForm" class="grid grid-cols-12 gap-6">

      <!-- LEFT PANEL -->
      <div class="col-span-12 md:col-span-4">

        <h3 class="text-lg font-semibold mb-4 font-bold" style="font-size: x-large;">Profile Photo</h3>

        <!-- Profile Photo -->
        <div class="relative w-40 h-40 mx-auto mb-4">
          <img *ngIf="previewUrl; else noPhoto" [src]="previewUrl"
               class="w-full h-full rounded-lg object-cover border border-gray-300" />

          <ng-template #noPhoto>
            <div class="w-full h-full rounded-lg bg-gray-200 flex items-center justify-center text-gray-500">
              No Image
            </div>
          </ng-template>
        </div>

        <label>
          <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
          <div class="cursor-pointer bg-gray-100 border border-gray-300 py-2 text-center rounded-md hover:bg-gray-200">
            Select Image
          </div>
        </label>

      </div>

      <!-- RIGHT PANEL -->
      <div class="col-span-12 md:col-span-8">

        <h3 class="text-lg font-semibold mb-4 font-bold">Profile Information</h3>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm">Full Name</label>
            <input type="text" formControlName="firstName"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm">Organization</label>
            <input type="text" formControlName="organization"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm">Date of Birth</label>
            <input type="date" formControlName="dob"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm">Location (State/Region, Country)</label>
            <input type="text" formControlName="location"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>
        </div>

        <br>
        <h3 class="text-lg font-semibold mt-6 mb-4">Contact Info</h3>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm">Phone Number</label>
            <input type="text" formControlName="phone"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm">Email</label>
            <input type="email" formControlName="email"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>
        </div>

        <br>
        <h3 class="text-lg mt-6 mb-2">Areas of Interest</h3>
        <input type="text" formControlName="interests"
          class="w-full border border-gray-300 p-2 rounded-md" />

        <br>
        <h3 class="text-lg mt-6 mb-2">About</h3>
        <textarea formControlName="bio" rows="3"
          class="w-full border border-gray-300 p-2 rounded-md"></textarea>

        <div class="mt-6 text-center">
          <button type="submit" (click)="signUp()"
            class="bg-purple-700 signUp-btn text-white px-8 py-2 rounded-md hover:bg-purple-800">
            SIGN UP
          </button>

          <div class="mt-4 text-sm">
            <a (click)="frogetPassword()" class="hover:text-purple-800 cursor-pointer">Forgot Password?</a>
            <br />
            <a (click)="loginPage = true; signUpPage = false;" class="hover:text-purple-800 cursor-pointer">
              Already have an account?
            </a>
          </div>

        </div>
      </div>

    </form>
    <!-- FORM ENDS -->

  </div>
</div>
