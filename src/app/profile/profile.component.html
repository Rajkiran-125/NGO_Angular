<div class="flex justify-center bg-gray-100 p-6" *ngIf="editProfile">
  <div class="w-full max-w-6xl bg-white border border-gray-300 rounded-lg p-6">

    <!-- FORM STARTS -->
    <form [formGroup]="updateProfile" class="grid grid-cols-12 gap-6">

      <!-- LEFT PANEL -->
      <div class="col-span-12 md:col-span-4">

        <h3 class="text-lg font-semibold mb-4 font-bold" style="font-size: x-large;">Profile</h3>

        <!-- Profile Photo -->
        <div class="relative w-40 h-40 mx-auto mb-4">
          <img *ngIf="previewUrl; else noImage" [src]="previewUrl"
               class="w-full h-full rounded-lg object-cover border border-gray-300" />

          <ng-template #noImage>
            <div class="w-full h-full rounded-lg bg-gray-200 flex items-center justify-center text-gray-500">
              No Image
            </div>
          </ng-template>
        </div>

        <label>
          <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
          <div class="cursor-pointer bg-gray-100 border border-gray-300 py-2 text-center rounded-md hover:bg-gray-200">
            Upload Photo
          </div>
        </label>

        <!-- <div class="mt-6">
          <label class="text-sm font-semibold">Old Password</label>
          <input type="password" class="w-full border border-gray-300 p-2 rounded-md mb-3" />

          <label class="text-sm font-semibold">New Password</label>
          <input type="password" class="w-full border border-gray-300 p-2 rounded-md mb-3" />

          <button class="w-full bg-purple-700 text-white font-bold py-2 rounded-md hover:bg-purple-800">
            Change Password
          </button>
        </div> -->

      </div>

      <!-- RIGHT PANEL -->
      <div class="col-span-12 md:col-span-8">

        <h3 class="text-lg font-semibold mb-4 font-bold">Profile Information</h3>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm ">First Name</label>
            <input type="text" formControlName="firstName"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm ">Last Name</label>
            <input type="text" formControlName="lastName"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm ">Organization</label>
            <input type="text" formControlName="organization"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm">DOB</label>
            <input type="date" formControlName="dob"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>
        </div>
        <br>
        <h3 class="text-lg font-semibold mt-6 mb-4">Contact Info</h3>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm ">Email</label>
            <input type="email" formControlName="email"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div>
            <label class="text-sm ">WhatsApp</label>
            <input type="text" formControlName="phoneNumber"
              class="w-full border border-gray-300 p-2 rounded-md" />
          </div>
        </div>

        <br>
        <h3 class="text-lg  mt-6 mb-2">About</h3>
        <textarea formControlName="bio"
          class="w-full border border-gray-300 p-2 rounded-md"
          rows="3"></textarea>

        <div class="mt-6 text-center updatebtn">
          <button type="submit"
            class="text-white px-8 py-2 rounded-md hover:bg-purple-800">
            Update Profile
          </button>
        </div>

      </div>

    </form>
    <!-- FORM ENDS -->

  </div>
</div>
