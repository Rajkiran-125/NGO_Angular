<div class="flex justify-center bg-gray-100" *ngIf="editProfile" style="padding:40px 60px;">
  <div class="w-full max-w-6xl bg-white border border-gray-300 rounded-lg p-6">

    <!-- FORM STARTS -->
    <form [formGroup]="updateProfile" class="grid grid-cols-12 gap-6">

      <!-- LEFT PANEL -->
      <div class="col-span-12 md:col-span-4">

        <h3 class="text-xl font-bold mb-4">Profile Picture *</h3>

        <!-- Profile Photo -->
        <div class="relative w-40 h-40 mx-auto mb-4">
          <img *ngIf="previewUrl; else noImage" 
               [src]="uploadPic ? previewUrl : fileBaseUrl + previewUrl"
               class="w-full h-full rounded-lg object-cover border border-gray-300" />

          <ng-template #noImage>
            <div class="w-full h-full rounded-lg bg-gray-200 flex items-center justify-center text-gray-500">
              No Image
            </div>
          </ng-template>
        </div>

        <label>
          <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
          <div class="cursor-pointer bg-gray-100 border border-gray-300 py-2 text-center rounded-md hover:bg-gray-200">
            Upload Photo
          </div>
        </label>

      </div>

      <!-- RIGHT PANEL -->
      <div class="col-span-12 md:col-span-8">

        <!-- Profile Information -->
        <h3 class="text-lg font-semibold mb-4">Profile Information</h3>

        <div class="grid grid-cols-2 gap-4">

          <div>
            <label class="text-sm">First Name *</label>
            <input type="text" formControlName="firstName"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

          <div>
            <label class="text-sm">Last Name *</label>
            <input type="text" formControlName="lastName"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

          <div class="col-span-2">
            <label class="text-sm">School / Organization Affiliation *</label>
            <input type="text" formControlName="organization"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

          <div>
            <label class="text-sm">Date of Birth *</label>
            <input type="date" formControlName="dob"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

          <div>
            <label class="text-sm">State / Region</label>
            <input type="text" formControlName="state"
                   class="w-full border border-gray-300 p-2 rounded-md" />
          </div>

          <div class="col-span-2">
            <label class="text-sm">Country *</label>
            <input type="text" formControlName="country"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

        </div>

        <br>

        <!-- Contact Information -->
        <h3 class="text-lg font-semibold mb-4">Contact Information</h3>

        <div class="grid grid-cols-2 gap-4">

          <div>
            <label class="text-sm">Phone Number *</label>
            <input type="text" formControlName="phoneNumber"
                   class="w-full border border-gray-300 p-2 rounded-md" required />
          </div>

          <div>
            <label class="text-sm">Email *</label>
            <input type="email" formControlName="email"
                   class="w-full border border-gray-300 p-2 rounded-md"
                   [disabled]="true" required />
          </div>

        </div>

        <br>

        <!-- Areas of Interest -->
        <h3 class="text-lg font-semibold mb-2">Causes / Areas of Interest *</h3>
        <input type="text" formControlName="interests"
               class="w-full border border-gray-300 p-2 rounded-md" required />

        <br>

        <!-- Submit Button -->
        <div class="mt-6 text-center updatebtn">
          <button type="button" (click)="updateProfileFun()"
            class="bg-purple-700 text-white px-8 py-2 rounded-md hover:bg-purple-800">
            Update Profile
          </button>
        </div>

      </div>

    </form>
    <!-- FORM ENDS -->

  </div>
</div>
