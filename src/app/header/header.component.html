<nav class="bg-white shadow-lg fixheader" id="navbar">
    <div class="max-w-7xl mx-auto px-4 ">
        <div class="flex justify-between items-center py-2">

            <!-- Logo -->
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-blue-600 logo">
                    <img src="assets/Image/logo.png" alt="logo">
                </h1>
            </div>
            
            <!-- Right Side -->
            <div class="flex items-center gap-4" *ngIf="isLoggedIn$ | async">

                <button *ngIf="isAdmin" class="px-4 py-1 dashboard-btn text-white rounded-md hover:bg-blue-700 transition"
                    (click)="impactMetrics()">
                    Impact&nbsp;Metrics
                </button>
                <!-- Dashboard Button -->
                <button class="px-4 py-1 dashboard-btn text-white rounded-md hover:bg-blue-700 transition"
                    (click)="showDashboard()">
                    Dashboard
                </button>
                <!-- Recognition Tier Breakdown -->
                <button *ngIf="isAdmin" class="px-4 py-1 tierbreakdown-btn text-white rounded-md hover:bg-blue-700 transition"
                    (click)="tierBreakdown()">
                    Tier&nbsp;Breakdown
                </button>

                <!-- User Greeting -->
                <span id="userGreeting" class="text-gray-700"></span>


                <!-- Dropdown -->
                <div class="custom-dropdown">
                    <!-- User Icon -->

                    <div class="flex">

                        <button (click)="toggleMenu()">
                            <i class="fa-regular fa-user text-xl"></i>
                        </button>
                        <button class="dropdown-btn"  (click)="toggleMenu()">
                            ▼
                        </button>
                    </div>

                    <div class="dropdown-menu" *ngIf="menuOpen">
                        <!-- <div class="dropdown-item" *ngIf="currentRoute !== '/profile'" (click)="openProfile()">
                            My Profile
                        </div> -->
                        <div class="dropdown-item"  (click)="openProfile()">
                            My Profile
                        </div>

                        <!-- <div class="dropdown-item"  (click)="showDashboard()">
                            Dashboard
                        </div> -->
                        <!-- <div *ngIf="isAdmin">
                            <div class="dropdown-item" (click)="tierBreakdown()">
                                Tier Breakdown
                            </div>
                            <div class="dropdown-item" (click)="impactMetrics()">
                                Impact Metrics
                            </div>
                        </div> -->

                        <div class="dropdown-item" (click)="changePassword()">Change Password</div>
                        <div class="dropdown-item" (click)="logout()">Logout</div>
                    </div>
                </div>

                <!-- Help Icon -->
                <a href="https://nest4us.org/connect-with-us/" target="_blank" *ngIf="!isAdmin">
                    <i class="fa-solid fa-question text-xl"></i>
                </a>
            </div>
        </div>
    </div>
</nav>
